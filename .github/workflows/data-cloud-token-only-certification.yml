name: Salesforce Data Cloud Token Exchange Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salesforce-data-cloud-token-only
  cancel-in-progress: false

jobs:
  token-exchange:
    name: Data Cloud OAuth only, no record writes
    runs-on: ubuntu-latest
    environment: salesforce-growth-certification
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none
      - name: Exchange Data Cloud token only
        env:
          SF_GROWTH_ORG_URL: ${{ vars.SF_GROWTH_ORG_URL }}
          SF_GROWTH_CLIENT_ID: ${{ secrets.SF_GROWTH_CLIENT_ID }}
          SF_GROWTH_CLIENT_SECRET: ${{ secrets.SF_GROWTH_CLIENT_SECRET }}
          SF_DC_EVIDENCE_PATH: data-cloud-token-only-certification.json
        run: php tests/live/data-cloud-token-only-certification.php
      - name: Upload sanitized evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-cloud-token-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: data-cloud-token-only-certification.json
          if-no-files-found: ignore
          retention-days: 30
