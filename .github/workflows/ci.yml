name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4', '8.0', '8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find pssalesforcebridge tests -name '*.php' -print0 | xargs -0 -n1 php -l

  health-contract:
    name: Health contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run health contracts
        run: |
          php tests/health-service-contract.php
          php tests/health-dashboard-contract.php

  sync-contract:
    name: Sync correctness (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run sync correctness contract
        run: php tests/sync-correctness-contract.php

  retention-contract:
    name: Retention contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run privacy retention contract
        run: php tests/retention-contract.php

  release-contract:
    name: Release contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate release and upgrade contract
        run: |
          php tests/release-contract.php
          php tests/db-single-row-contract.php
          php tests/db-namespace-contract.php
          php tests/sfmc-live-certification-contract.php

  growth-auth-contract:
    name: Growth OAuth contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run Growth auth-only and metadata discovery contracts
        run: |
          php tests/growth-oauth-contract.php
          php tests/growth-discovery-contract.php
          php tests/growth-schema-contract.php
          php tests/data-cloud-mapping-contract.php
          php tests/data-cloud-batch-contract.php
          php tests/data-cloud-timestamp-contract.php
          php tests/data-cloud-timestamp-quality-contract.php
          php tests/data-cloud-shop-timezone-contract.php
          php tests/data-cloud-v03-payload-contract.php
          php tests/data-cloud-multi-installation-contract.php
          php tests/data-cloud-installation-readiness-contract.php
          php tests/data-cloud-token-exchange-contract.php
          php tests/data-cloud-token-only-workflow-contract.php

  data-cloud-schema-contract:
    name: ABH PST Data Cloud schema review (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate PST review schema against live mapper fixtures (no Salesforce calls)
        run: python scripts/ci/validate-pst-ingestion-schema.py

  package:
    name: Build release package
    runs-on: ubuntu-latest
    needs: [php-syntax, health-contract, sync-contract, retention-contract, release-contract, growth-auth-contract, data-cloud-schema-contract]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Build and validate versioned ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.7.0
          mkdir -p build
          ZIP="build/pssalesforcebridge-${VERSION}.zip"
          zip -r "$ZIP" pssalesforcebridge \
            -x '*/vendor/*' '*.DS_Store'
          unzip -Z1 "$ZIP" | grep -qx 'pssalesforcebridge/pssalesforcebridge.php'
          unzip -Z1 "$ZIP" | grep -qx 'pssalesforcebridge/upgrade/upgrade-0.7.0.php'
          if unzip -Z1 "$ZIP" | grep -q '^pssalesforcebridge/vendor/'; then
            echo 'vendor directory must not be packaged'
            exit 1
          fi
          unzip -p "$ZIP" pssalesforcebridge/pssalesforcebridge.php | grep -Fq "\$this->version = '0.7.0';"
          unzip -p "$ZIP" pssalesforcebridge/composer.json | grep -Fq '"php": ">=7.1"'
          sha256sum "$ZIP" > "${ZIP}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pssalesforcebridge-0.7.0
          path: |
            build/pssalesforcebridge-0.7.0.zip
            build/pssalesforcebridge-0.7.0.zip.sha256
          if-no-files-found: error
