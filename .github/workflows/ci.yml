name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4', '8.0', '8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find pssalesforcebridge tests -name '*.php' -print0 | xargs -0 -n1 php -l

  health-contract:
    name: Health contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run health contracts
        run: |
          php tests/health-service-contract.php
          php tests/health-dashboard-contract.php

  sync-contract:
    name: Sync correctness (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run sync correctness contract
        run: php tests/sync-correctness-contract.php

  package:
    name: Build installable module
    runs-on: ubuntu-latest
    needs: [php-syntax, health-contract, sync-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          mkdir -p build
          zip -r build/pssalesforcebridge.zip pssalesforcebridge \
            -x '*/vendor/*' '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: pssalesforcebridge
          path: build/pssalesforcebridge.zip
          if-no-files-found: error
