name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-focus:
    name: ABH provider focus (fail closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Validate ABH canonical provider, Test gate and pilot rules
        run: |
          python3 scripts/ci/verify-project-focus.py
          python3 -m unittest discover -s tests -p 'test_project_focus.py'

  growth-product-boundary:
    name: Growth + Data Cloud source boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Reject obsolete product names, endpoints and documentation
        run: python3 scripts/ci/verify-no-retired-platform.py

  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.4', '8.0', '8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: find pssalesforcebridge tests -name '*.php' -print0 | xargs -0 -n1 php -l

  growth-only-module:
    name: Growth-only module (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Certify Growth-only source, safe upgrade, no legacy egress
        run: |
          php tests/growth-only-module-contract.php
          php tests/growth-explicit-provider-routing-contract.php
          php tests/growth-provider-outbox-bridge-contract.php

  growth-auth-contract:
    name: Growth OAuth contract (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Run Growth auth-only and metadata discovery contracts
        run: |
          php tests/growth-oauth-contract.php
          php tests/growth-discovery-contract.php
          php tests/growth-schema-contract.php
          php tests/data-cloud-mapping-contract.php
          php tests/growth-pst-synthetic-preview-contract.php
          php tests/g3-growth-typed-identity-contract.php
          php tests/g4-typed-pst-payload-contract.php
          php tests/g7-native-customer-order-draft-contract.php
          php tests/g7-captured-outbox-pst-preview-contract.php
          php tests/g7-fresh-source-rehearsal-contract.php
          php tests/g7-delivery-schema-plan-contract.php
          php tests/g7-staging-delivery-migration-contract.php
          php tests/g7-native-prestashop-lease-contract.php
          php tests/g7-native-preflight-contract.php
          php tests/g7-current-event-batch-contract.php
          php tests/g7-dry-run-batch-orchestrator-contract.php
          php tests/g7-native-csc-presend-review-contract.php
          php tests/g7-streaming-ingestion-plan-contract.php
          php tests/g7-streaming-transport-contract.php
          php tests/g7-one-record-manual-contract.php
          php tests/growth-generic-merchant-source-contract.php
          php tests/growth-one-record-safe-diagnosis-contract.php
          php tests/growth-shop-credential-vault-contract.php
          php tests/growth-prebeta-admin-ui-contract.php
          php tests/g7-live-existing-canary-readonly-contract.php
          php tests/g7-staging-hook-capture-contract.php
          php tests/g5-synthetic-actions-test-contract.php
          php tests/g5-controlled-synthetic-upsert-contract.php
          php tests/g5-pst-host-attestation-contract.php
          php tests/g3-dlo-dmo-relationship-contract.php
          php tests/g3-tenant-dmo-catalog-contract.php
          php tests/g3-dmo-mapping-metadata-contract.php
          php tests/g3-pst-stream-presence-contract.php
          php tests/data-cloud-batch-contract.php
          php tests/data-cloud-timestamp-contract.php
          php tests/data-cloud-timestamp-quality-contract.php
          php tests/g3-record-modified-refresh-review-contract.php
          php tests/data-cloud-live-utc-observation-contract.php
          php tests/data-cloud-atomic-utc-acceptance-contract.php
          php tests/g3-growth-cart-source-presend-contract.php
          php tests/g3-growth-order-evidence-contract.php
          php tests/growth-local-order-presence-contract.php
          php tests/growth-cart-conversion-hold-gate-contract.php
          php tests/g7-native-cart-recovery-hold-contract.php
          php tests/g7-cart-inactivity-60m-contract.php
          php tests/g7-snapshot-equivalence-contract.php
          php tests/g7-legacy-cart-snapshot-sha1-contract.php
          php tests/g7-fresh-native-legacy-snapshot-contract.php
          php tests/growth-local-customer-hold-contract.php
          php tests/g6-growth-csc-suppression-contract.php
          php tests/g6-core-subscription-inventory-contract.php
          php tests/g6-marketing-email-core-binding-contract.php
          php tests/g6-csc-dmo-metadata-contract.php
          php tests/g6-consent-topology-contract.php
          php tests/growth-fresh-safety-reads-contract.php
          php tests/growth-explicit-provider-routing-contract.php
          php tests/growth-provider-outbox-bridge-contract.php
          php tests/growth-blocked-hook-adapter-contract.php
          php tests/growth-schema-plan-contract.php
          php tests/growth-sql-engine-gate-contract.php
          php tests/data-cloud-shop-timezone-contract.php
          php tests/data-cloud-v03-payload-contract.php
          php tests/data-cloud-multi-installation-contract.php
          php tests/data-cloud-installation-readiness-contract.php
          php tests/data-cloud-token-exchange-contract.php
          php tests/data-cloud-token-only-workflow-contract.php

  data-cloud-schema-contract:
    name: ABH PST Data Cloud schema review (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Validate PST review schema against live mapper fixtures (no Salesforce calls)
        run: python scripts/ci/validate-pst-ingestion-schema.py
      - name: G3 full 24-field review + negative approval tests (offline)
        run: |
          python -m unittest discover -s tests -p 'test_g3_typed_identity_schema.py'
          python scripts/ci/verify-g3-schema-review.py
          python -m unittest discover -s tests -p 'test_g3_schema_review.py'
          python scripts/ci/verify-g3-review-fingerprint.py
          python -m unittest discover -s tests -p 'test_g3_review_fingerprint.py'
          python scripts/ci/verify-g3-owner-decision-brief.py
          python -m unittest discover -s tests -p 'test_g3_owner_decision_brief.py'
          python scripts/ci/verify-g3-field-purpose-owner-decisions.py
          python -m unittest discover -s tests -p 'test_g3_field_purpose_owner_decisions.py'
          python scripts/ci/verify-g3-dlo-dmo-mapping-candidate.py
          python -m unittest discover -s tests -p 'test_g3_dlo_dmo_mapping_candidate.py'
          python scripts/ci/verify-g3-business-goal-coverage.py
          python scripts/ci/verify-g3-technical-closure.py
          python scripts/ci/verify-g6-native-consent-policy.py
          python -m unittest discover -s tests -p 'test_g6_native_consent_policy.py'
          python -m unittest discover -s tests -p 'test_g3_technical_closure.py'
          python scripts/ci/verify-g3-signoff-handoff.py
          python -m unittest discover -s tests -p 'test_g3_signoff_handoff.py'
          python scripts/ci/render-g4-readiness-report.py
          python -m unittest discover -s tests -p 'test_g4_unified_readiness.py'
          python scripts/ci/build-g4-pst-typed-preview.py
          python -m unittest discover -s tests -p 'test_g4_pst_typed_preview.py'
          python scripts/ci/verify-g4-pst-upload-schema.py
          python -m unittest discover -s tests -p 'test_g4_pst_upload_schema.py'
          python -m unittest discover -s tests -p 'test_g3_business_goal_coverage.py'
          python -m unittest discover -s tests -p 'test_g3_dmo_review_summary.py'
          python scripts/ci/verify-bc-timestamp-sql-readonly.py
          python -m unittest discover -s tests -p 'test_bc_timestamp_sql_readonly.py'
      - uses: actions/upload-artifact@v4
        with:
          name: g4-pst-v04-offline-preview-only
          path: build/g4-pst-typed-preview/
          if-no-files-found: error

  g3-mysql-sandbox:
    name: G3 atomic DB sandbox (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql8
            image: mysql:8.0
          - database: mariadb10
            image: mariadb:10.11
          - database: mariadb118
            image: mariadb:11.8
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: g3_ci_root_only
          MYSQL_DATABASE: g3_ci
          MYSQL_USER: g3_ci_user
          MYSQL_PASSWORD: g3_ci_pass_only
        ports:
          - 3306:3306
    env:
      G3_CI_ENABLE: yes_sandbox_only
      G3_CI_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=g3_ci;charset=utf8mb4'
      G3_CI_USER: g3_ci_user
      G3_CI_PASSWORD: g3_ci_pass_only
      G7_CI_LEASE_ENABLE: yes_synthetic_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
      - name: Confirm PDO MySQL and fail-closed staging safeguards
        run: |
          php -m | grep -qi 'pdo_mysql'
          php -l tests/integration/G3SandboxPdoJournal.php
          php -l tests/integration/g3_mysql_acceptance.php
          php -l tests/integration/G3GrowthOutboxSandboxMigration.php
          php -l tests/integration/G3GrowthOutboxSandboxStore.php
          php -l tests/integration/g3_growth_outbox_v1.php
      - name: Certify isolated transactional journal and legacy queue mirror
        run: |
          php tests/integration/g3_mysql_acceptance.php
          php tests/integration/g3_growth_outbox_v1.php
          php tests/integration/g3_growth_provider_outbox_bridge.php
          php tests/integration/g3_growth_prefixed_schema_preview.php
          php tests/integration/g3_growth_migration_executor.php
          php tests/integration/g3_growth_prestashop_db_store.php
          php tests/integration/g3_namespace_registry.php
          php tests/integration/g3_proof_key_lifecycle.php
          php tests/integration/g7_g3_blocked_version_claim_review.php
          php tests/integration/g7_durable_outbox_lease.php
          php tests/integration/g7_staging_capture_prestashop_db.php

  package:
    name: Build release package
    runs-on: ubuntu-latest
    needs: [growth-product-boundary, php-syntax, growth-only-module, growth-auth-contract, data-cloud-schema-contract, g3-mysql-sandbox]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Build and validate versioned ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.9.4
          mkdir -p build
          ZIP="build/pssalesforcebridge-${VERSION}.zip"
          zip -r "$ZIP" pssalesforcebridge \
            -x '*/vendor/*' '*.DS_Store'
          unzip -Z1 "$ZIP" | grep -qx 'pssalesforcebridge/pssalesforcebridge.php'
          unzip -Z1 "$ZIP" | grep -qx 'pssalesforcebridge/upgrade/upgrade-0.9.4.php'
          if unzip -Z1 "$ZIP" | awk -F/ '$1=="pssalesforcebridge" && $2=="src" && NF>=4 {print $3}' | sort -u | grep -Ev '^(Compatibility|DataCloud|Growth|Provider)$'; then
            echo 'Unrecognized package source directory'
            exit 1
          fi
          if unzip -Z1 "$ZIP" | grep -Eiq '(^pssalesforcebridge/controllers/front/recover.php|^pssalesforcebridge/upgrade/upgrade-0\.7\.)'; then
            echo 'Legacy adapter or old upgrade logic must not ship in the Growth-only ZIP'
            exit 1
          fi
          if unzip -Z1 "$ZIP" | grep -q '^pssalesforcebridge/vendor/'; then
            echo 'vendor directory must not be packaged'
            exit 1
          fi
          unzip -p "$ZIP" pssalesforcebridge/pssalesforcebridge.php | grep -Fq "\$this->version = '0.9.4';"
          unzip -p "$ZIP" pssalesforcebridge/pssalesforcebridge.php | grep -Fq "\$this->author = 'ALFABH';"
          unzip -p "$ZIP" pssalesforcebridge/composer.json | grep -Fq '"name": "ALFABH"'
          unzip -p "$ZIP" pssalesforcebridge/composer.json | grep -Fq '"php": ">=7.1"'
          sha256sum "$ZIP" > "${ZIP}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pssalesforcebridge-0.9.4
          path: |
            build/pssalesforcebridge-0.9.4.zip
            build/pssalesforcebridge-0.9.4.zip.sha256
          if-no-files-found: error
