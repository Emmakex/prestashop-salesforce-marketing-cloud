name: G5 PST Host Diagnostic (No Data)

# After Salesforce returned 202 to /actions/test on 2026-11-16,
# disable all live ingestion/validation POSTs in this workflow.
# Only inspect the Data Cloud OAuth token instance_url against the SHA256
# of the official PST object endpoint hostname, without revealing either.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'OAuth-only PST endpoint host verification: NO data requests'
        required: true
        type: choice
        options:
          - diagnose_host_no_payload

permissions:
  contents: read

concurrency:
  group: g5-pst-host-diagnostic-no-data
  cancel-in-progress: false

jobs:
  host-diagnostic-only:
    if: >-
      github.repository == 'Emmakex/prestashop-salesforce-marketing-cloud' &&
      github.ref == 'refs/heads/main' &&
      inputs.action == 'diagnose_host_no_payload'
    name: G5 read-only OAuth host attestation (no ingest/validation)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: salesforce-growth-certification
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Ensure exact SHA, correct repo and no payload-runner dispatch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "Emmakex/prestashop-salesforce-marketing-cloud"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test -f tests/live/g5-pst-host-diagnostic-only.php
          grep -Fq "G5PstEndpointAttestation" tests/live/g5-pst-host-diagnostic-only.php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl
          coverage: none
      - name: Offline endpoint fingerprint and fail-closed tests
        run: php tests/g5-pst-host-attestation-contract.php
      - name: Compare Data Cloud token host with official PST endpoint host
        env:
          G5_PST_HOST_MODE: diagnose_host_no_payload
          G5_PST_HOST_CONFIRM: ${{ inputs.action }}
          SF_GROWTH_ORG_URL: ${{ vars.SF_GROWTH_ORG_URL }}
          SF_GROWTH_CLIENT_ID: ${{ secrets.SF_GROWTH_CLIENT_ID }}
          SF_GROWTH_CLIENT_SECRET: ${{ secrets.SF_GROWTH_CLIENT_SECRET }}
          G5_PST_HOST_EVIDENCE_PATH: g5-pst-host-diagnostic-sanitized.json
        run: php tests/live/g5-pst-host-diagnostic-only.php
      - name: Upload sanitized host match result only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g5-pst-host-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: g5-pst-host-diagnostic-sanitized.json
          if-no-files-found: ignore
          retention-days: 14
